<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The icon of the extension: the logo of cromolang.org on a dark tile, with the orbit in light chrome. images/icon.png is made from it by build-vsix.ps1 -Icon. -->
  <defs>
    <radialGradient id="tile" cx="0.82" cy="0.12" r="1.15">
      <stop offset="0" stop-color="#24354d"/>
      <stop offset="0.55" stop-color="#0f151e"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d697b"/>
      <stop offset="0.38" stop-color="#c9d1dc"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="0.74" stop-color="#9ba6b5"/>
      <stop offset="1" stop-color="#4b5565"/>
    </linearGradient>
    <radialGradient id="nucleus" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#cfd6df"/>
      <stop offset="0.8" stop-color="#7c8797"/>
      <stop offset="1" stop-color="#4b5565"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <g transform="translate(128 128) scale(3.3) rotate(-28)">
    <path d="M23.84 -5.16A27 11 0 1 0 23.84 5.16" fill="none" stroke="url(#orbit)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="23.84" cy="5.16" r="3.6" fill="#0ea5c6"/>
  </g>
  <circle cx="128" cy="128" r="29.7" fill="url(#nucleus)" stroke="#3a4454" stroke-width="3.3"/>
</svg>
