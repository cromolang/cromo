# nginx for cromolang.org: the folder that tools\site.ps1 writes in dist\site,
# copied to /var/www/cromolang.org. The certificates are those of Let's Encrypt
# (certbot); change the paths if they are elsewhere. The file goes in
# /etc/nginx/sites-available, inside the http block of nginx.conf.

# How long a browser keeps a file: the pages, the installers and the manifests are
# checked again at every visit; an archive never changes, since a new version has
# a new name; the rest, as the styles and the logos, is kept a day.
map $uri $cromo_cache {
    ~\.html$        "no-cache";
    /install.ps1    "no-cache";
    /install.sh     "no-cache";
    /latest         "no-cache";
    /latest.sig     "no-cache";
    ~^/release/     "no-cache";
    ~^/package/     "public, max-age=31536000, immutable";
    default         "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name cromolang.org www.cromolang.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://cromolang.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cromolang.org;

    ssl_certificate     /etc/letsencrypt/live/cromolang.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cromolang.org/privkey.pem;

    return 301 https://cromolang.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cromolang.org;

    ssl_certificate     /etc/letsencrypt/live/cromolang.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cromolang.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/cromolang.org;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    # The headers are set only here: a location with add_header of its own would
    # drop them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cromo_cache always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # The installers are read by PowerShell and by sh as text.
    location = /install.ps1 {
        default_type text/plain;
    }
    location = /install.sh {
        default_type text/plain;
    }

    # The manifests have no extension (D285); their signatures are hex text (D286).
    location = /latest {
        default_type application/json;
    }
    location = /latest.sig {
        default_type text/plain;
    }
    location ^~ /release/ {
        default_type application/json;
        location ~ \.sig$ {
            default_type text/plain;
        }
    }
}
