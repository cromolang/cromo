# nginx for cromolang.org: the folder that tools\site.ps1 writes in dist\site,
# copied to /var/www/cromolang.org. The file goes in /etc/nginx/sites-available,
# linked from sites-enabled, inside the http block of nginx.conf; nginx 1.24, so
# HTTP/2 is a parameter of listen. The certificate covers cromolang.org and
# *.cromolang.org: the certificate followed by its intermediates in fullchain.pem.
#
# The firewall of the server accepts only the ports 22 and 443, so there is no
# server on port 80. Where port 80 is open, a server with
#     listen 80; listen [::]:80; server_name cromolang.org www.cromolang.org;
#     return 301 https://cromolang.org$request_uri;
# sends the visitors to HTTPS.

# How long a browser keeps a file: the pages, the installers and the manifests are
# checked again at every visit; an archive never changes, since a new version has
# a new name; the rest, as the styles and the logos, is kept a day.
map $uri $cromo_cache {
    ~\.html$        "no-cache";
    /install.ps1    "no-cache";
    /install.sh     "no-cache";
    /latest         "no-cache";
    /latest.sig     "no-cache";
    ~^/release/     "no-cache";
    ~^/package/     "public, max-age=31536000, immutable";
    default         "public, max-age=86400";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cromolang.org;

    ssl_certificate     /etc/nginx/ssl/cromolang.org.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cromolang.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    return 301 https://cromolang.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cromolang.org;

    ssl_certificate     /etc/nginx/ssl/cromolang.org.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cromolang.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /var/www/cromolang.org;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    access_log /var/log/nginx/cromolang-access.log;
    error_log  /var/log/nginx/cromolang-error.log warn;

    # The headers are set only here: a location with add_header of its own would
    # drop them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cromo_cache always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # The installers are read by PowerShell and by sh as text.
    location = /install.ps1 {
        default_type text/plain;
    }
    location = /install.sh {
        default_type text/plain;
    }

    # The manifests have no extension (D285); their signatures are hex text (D286).
    location = /latest {
        default_type application/json;
    }
    location = /latest.sig {
        default_type text/plain;
    }
    location ^~ /release/ {
        default_type application/json;
        location ~ \.sig$ {
            default_type text/plain;
        }
    }
}
